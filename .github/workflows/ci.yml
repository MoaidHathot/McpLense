name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/Directory.Build.props', 'global.json', 'NuGet.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore src/McpLense.slnx

      - name: Build (Release, warnaserror)
        run: dotnet build src/McpLense.slnx -c Release --no-restore -warnaserror

      - name: Test (with coverage)
        run: dotnet test src/McpLense.slnx -c Release --no-build --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage" --settings coverlet.runsettings --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            TestResults/**/*.trx
            TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

      - name: Install ReportGenerator (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate coverage report (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          reportgenerator \
            "-reports:TestResults/**/coverage.cobertura.xml" \
            "-targetdir:CoverageReport" \
            "-reporttypes:Html;MarkdownSummaryGithub;TextSummary"

      - name: Publish coverage summary to job summary (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          if [ -f CoverageReport/SummaryGithub.md ]; then
            echo "## Coverage Summary" >> "$GITHUB_STEP_SUMMARY"
            cat CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Coverage summary not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage HTML report (Linux only)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-html
          path: CoverageReport
          if-no-files-found: warn
